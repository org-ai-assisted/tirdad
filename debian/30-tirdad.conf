## Gets copied to:
## /etc/modprobe.d/30-tirdad.conf

## Load tirdad before LKRG so LKRG baselines the kernel AFTER tirdad has
## livepatched it; otherwise LKRG's integrity check sees the patch as tampering
## and panics. This softdep is the load-order guarantee (tirdad no longer loads
## via modules-load.d, so file ordering no longer applies). Both module names are
## listed because LKRG renamed its module from p_lkrg to lkrg; a softdep for an
## absent module is inert, so listing both is safe and covers either version.
softdep p_lkrg pre: tirdad
softdep lkrg pre: tirdad
